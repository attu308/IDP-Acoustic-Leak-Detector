; PlatformIO Project Configuration for Smart Acoustic Leak Detector
; Target Architecture: ESP32-S3 Dual-Core LX7 (240 MHz)

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O3

lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.0
